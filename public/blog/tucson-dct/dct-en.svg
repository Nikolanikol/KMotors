<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8A8A8A"/></marker>
  </defs>
  <rect width="1200" height="720" rx="24" fill="#141414"/>
  <text x="48" y="62" fill="#F5F0EB" font-size="28" font-weight="700">How a dual-clutch (DCT) gearbox works</text>
  <text x="48" y="94" fill="#8A8A8A" font-size="18">Two gearboxes in one: odd gears on one shaft, even gears on the other.</text>

  <!-- engine -->
  <rect x="48" y="200" width="150" height="150" rx="14" fill="#1E1E1E" stroke="rgba(255,255,255,0.12)"/>
  <text x="123" y="270" fill="#F5F0EB" font-size="20" font-weight="700" text-anchor="middle">Engine</text>
  <line x1="198" y1="275" x2="258" y2="275" stroke="#8A8A8A" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- clutches -->
  <rect x="260" y="160" width="170" height="100" rx="14" fill="rgba(182,119,73,0.16)" stroke="#B67749" stroke-width="2.5"/>
  <text x="345" y="202" fill="#C88858" font-size="20" font-weight="700" text-anchor="middle">Clutch 1</text>
  <text x="345" y="228" fill="#C0C0C0" font-size="15" text-anchor="middle">engaged — driving</text>
  <rect x="260" y="290" width="170" height="100" rx="14" fill="#1E1E1E" stroke="rgba(255,255,255,0.18)" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="345" y="332" fill="#F5F0EB" font-size="20" font-weight="700" text-anchor="middle">Clutch 2</text>
  <text x="345" y="358" fill="#C0C0C0" font-size="15" text-anchor="middle">open — waiting</text>

  <!-- shafts -->
  <line x1="430" y1="210" x2="498" y2="210" stroke="#C88858" stroke-width="3" marker-end="url(#a)"/>
  <line x1="430" y1="340" x2="498" y2="340" stroke="#8A8A8A" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="500" y="170" width="380" height="80" rx="14" fill="#1E1E1E" stroke="#B67749" stroke-width="2"/>
  <text x="520" y="203" fill="#F5F0EB" font-size="18" font-weight="600">Shaft 1 — odd gears</text>
  <g font-size="18" font-weight="700" text-anchor="middle">
    <circle cx="560" cy="228" r="16" fill="#9D5E34"/><text x="560" y="234" fill="#fff">1</text>
    <circle cx="610" cy="228" r="16" fill="#1E1E1E" stroke="#4A4A4A"/><text x="610" y="234" fill="#C0C0C0">3</text>
    <circle cx="660" cy="228" r="16" fill="#1E1E1E" stroke="#4A4A4A"/><text x="660" y="234" fill="#C0C0C0">5</text>
    <circle cx="710" cy="228" r="16" fill="#1E1E1E" stroke="#4A4A4A"/><text x="710" y="234" fill="#C0C0C0">7</text>
  </g>
  <text x="745" y="234" fill="#C88858" font-size="15">← engaged</text>
  <rect x="500" y="300" width="380" height="80" rx="14" fill="#1E1E1E" stroke="rgba(255,255,255,0.12)"/>
  <text x="520" y="333" fill="#F5F0EB" font-size="18" font-weight="600">Shaft 2 — even gears</text>
  <g font-size="18" font-weight="700" text-anchor="middle">
    <circle cx="560" cy="358" r="16" fill="#1E1E1E" stroke="#C88858" stroke-width="2.5" stroke-dasharray="4 3"/><text x="560" y="364" fill="#C88858">2</text>
    <circle cx="610" cy="358" r="16" fill="#1E1E1E" stroke="#4A4A4A"/><text x="610" y="364" fill="#C0C0C0">4</text>
    <circle cx="660" cy="358" r="16" fill="#1E1E1E" stroke="#4A4A4A"/><text x="660" y="364" fill="#C0C0C0">6</text>
    <circle cx="710" cy="358" r="16" fill="#1E1E1E" stroke="#4A4A4A"/><text x="710" y="364" fill="#C0C0C0">R</text>
  </g>
  <text x="745" y="364" fill="#C88858" font-size="15">← preselected</text>

  <line x1="880" y1="210" x2="938" y2="262" stroke="#C88858" stroke-width="3" marker-end="url(#a)"/>
  <line x1="880" y1="340" x2="938" y2="290" stroke="#8A8A8A" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="940" y="225" width="212" height="100" rx="14" fill="#1E1E1E" stroke="rgba(255,255,255,0.12)"/>
  <text x="1046" y="268" fill="#F5F0EB" font-size="20" font-weight="700" text-anchor="middle">To the wheels</text>
  <text x="1046" y="294" fill="#C0C0C0" font-size="15" text-anchor="middle">common output</text>

  <text x="48" y="440" fill="#C0C0C0" font-size="17">Shift 1 → 2: clutch 1 opens, clutch 2 closes — in a fraction of a second, with no loss of drive.</text>

  <!-- dry vs wet -->
  <rect x="48" y="480" width="540" height="190" rx="16" fill="rgba(229,72,77,0.07)" stroke="rgba(229,72,77,0.35)"/>
  <text x="72" y="520" fill="#F5F0EB" font-size="21" font-weight="700">Dry 7DCT</text>
  <text x="72" y="552" fill="#C0C0C0" font-size="16">The plates run in air. In traffic and on hills</text>
  <text x="72" y="576" fill="#C0C0C0" font-size="16">they heat up and wear fastest.</text>
  <text x="72" y="616" fill="#8A8A8A" font-size="15">Tucson TL and NX4, Sportage QL and NQ5, K5 JF —</text>
  <text x="72" y="640" fill="#8A8A8A" font-size="15">1.6 turbo petrol and 1.6 / 1.7 diesels</text>
  <rect x="612" y="480" width="540" height="190" rx="16" fill="rgba(182,119,73,0.08)" stroke="rgba(182,119,73,0.4)"/>
  <text x="636" y="520" fill="#F5F0EB" font-size="21" font-weight="700">Wet 8DCT</text>
  <text x="636" y="552" fill="#C0C0C0" font-size="16">The plates sit in oil, which cools them. Handles</text>
  <text x="636" y="576" fill="#C0C0C0" font-size="16">more load and copes better with traffic.</text>
  <text x="636" y="616" fill="#8A8A8A" font-size="15">Santa Fe 2.5 turbo, Sonata N Line,</text>
  <text x="636" y="640" fill="#8A8A8A" font-size="15">Avante N</text>
</svg>
