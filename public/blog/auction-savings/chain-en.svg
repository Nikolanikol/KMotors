<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8A8A8A"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#C88858"/></marker>
  </defs>
  <rect width="1200" height="660" rx="24" fill="#141414"/>
  <text x="48" y="62" fill="#F5F0EB" font-size="28" font-weight="700">Two routes from a Korean auction</text>
  <text x="48" y="94" fill="#8A8A8A" font-size="18">Through a dealer, every step adds to the price. Direct — only the auction fee.</text>

  <!-- auction -->
  <rect x="48" y="250" width="210" height="150" rx="16" fill="#1E1E1E" stroke="rgba(255,255,255,0.14)"/>
  <text x="153" y="300" fill="#F5F0EB" font-size="21" font-weight="700" text-anchor="middle">Auction</text>
  <text x="153" y="330" fill="#C0C0C0" font-size="15" text-anchor="middle">hammer price —</text>
  <text x="153" y="352" fill="#C0C0C0" font-size="15" text-anchor="middle">on average +14%</text>
  <text x="153" y="374" fill="#C0C0C0" font-size="15" text-anchor="middle">over the start</text>

  <!-- dealer lane -->
  <path d="M258 290 C 300 290, 300 180, 340 180" fill="none" stroke="#8A8A8A" stroke-width="2.5" marker-end="url(#g)"/>
  <text x="340" y="140" fill="#8A8A8A" font-size="15" font-weight="700" letter-spacing="1.5">VIA A DEALER · ENCAR</text>
  <rect x="342" y="152" width="190" height="62" rx="12" fill="#1E1E1E" stroke="rgba(255,255,255,0.12)"/>
  <text x="437" y="178" fill="#F5F0EB" font-size="16" font-weight="600" text-anchor="middle">Auction fee</text>
  <text x="437" y="200" fill="#8A8A8A" font-size="14" text-anchor="middle">paid by the dealer</text>
  <line x1="532" y1="183" x2="568" y2="183" stroke="#8A8A8A" stroke-width="2.5" marker-end="url(#g)"/>
  <rect x="570" y="152" width="190" height="62" rx="12" fill="#1E1E1E" stroke="rgba(255,255,255,0.12)"/>
  <text x="665" y="178" fill="#F5F0EB" font-size="16" font-weight="600" text-anchor="middle">Reconditioning</text>
  <text x="665" y="200" fill="#8A8A8A" font-size="14" text-anchor="middle">and dealer margin</text>
  <line x1="760" y1="183" x2="796" y2="183" stroke="#8A8A8A" stroke-width="2.5" marker-end="url(#g)"/>
  <rect x="798" y="152" width="190" height="62" rx="12" fill="#1E1E1E" stroke="rgba(255,255,255,0.12)"/>
  <text x="893" y="178" fill="#F5F0EB" font-size="16" font-weight="600" text-anchor="middle">Sales fees</text>
  <text x="893" y="200" fill="#8A8A8A" font-size="14" text-anchor="middle">~2.2% + ₩300–400k</text>
  <line x1="988" y1="183" x2="1024" y2="183" stroke="#8A8A8A" stroke-width="2.5" marker-end="url(#g)"/>
  <rect x="1026" y="140" width="126" height="86" rx="12" fill="#1E1E1E" stroke="rgba(255,255,255,0.2)"/>
  <text x="1089" y="178" fill="#F5F0EB" font-size="17" font-weight="700" text-anchor="middle">Encar</text>
  <text x="1089" y="202" fill="#F5F0EB" font-size="17" font-weight="700" text-anchor="middle">price</text>

  <!-- direct lane -->
  <path d="M258 360 C 300 360, 300 470, 340 470" fill="none" stroke="#C88858" stroke-width="3" marker-end="url(#b)"/>
  <text x="340" y="432" fill="#C88858" font-size="15" font-weight="700" letter-spacing="1.5">DIRECT · WITH US</text>
  <rect x="342" y="444" width="300" height="62" rx="12" fill="rgba(182,119,73,0.12)" stroke="#B67749" stroke-width="2"/>
  <text x="492" y="470" fill="#F5F0EB" font-size="16" font-weight="600" text-anchor="middle">Auction fee</text>
  <text x="492" y="492" fill="#C0C0C0" font-size="14" text-anchor="middle">varies by auction</text>
  <line x1="642" y1="475" x2="678" y2="475" stroke="#C88858" stroke-width="3" marker-end="url(#b)"/>
  <rect x="680" y="444" width="300" height="62" rx="12" fill="rgba(182,119,73,0.12)" stroke="#B67749" stroke-width="2"/>
  <text x="830" y="470" fill="#F5F0EB" font-size="16" font-weight="600" text-anchor="middle">Our on-site inspection</text>
  <text x="830" y="492" fill="#C0C0C0" font-size="14" text-anchor="middle">and insurance history</text>
  <line x1="980" y1="475" x2="1024" y2="475" stroke="#C88858" stroke-width="3" marker-end="url(#b)"/>
  <rect x="1026" y="432" width="126" height="86" rx="12" fill="rgba(182,119,73,0.22)" stroke="#C88858" stroke-width="2.5"/>
  <text x="1089" y="468" fill="#C88858" font-size="20" font-weight="800" text-anchor="middle">−10–15%</text>
  <text x="1089" y="494" fill="#F5F0EB" font-size="14" text-anchor="middle">vs dealer price</text>

  <text x="48" y="590" fill="#8A8A8A" font-size="15">Sales fees — the brokerage commission and "selling costs" a Korean dealer charges the buyer.</text>
  <text x="48" y="614" fill="#8A8A8A" font-size="15">10–15% is our average in practice; on popular models it can be less, and sometimes the auction is pricier than Encar.</text>
</svg>
